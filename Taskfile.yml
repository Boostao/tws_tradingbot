version: '3'

vars:
  APP_NAME: "tws_traderbot"
  APP_ID: "ca.boostao.tws_traderbot"
  BIN_DIR: "build/bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  linux:install-desktop:
    summary: Installs desktop entry and hicolor icon for Linux/Wayland window matching
    platforms: [linux]
    cmds:
      - |
        if [ -n "${CI:-}" ]; then
          exit 0
        fi
        DATA_DIR="${XDG_DATA_HOME:-$HOME/.local/share}"
        APP_DIR="${DATA_DIR}/applications"
        ICON_DIR="${DATA_DIR}/icons/hicolor/256x256/apps"
        mkdir -p "${APP_DIR}" "${ICON_DIR}"
        EXEC_PATH="$(pwd)/{{.BIN_DIR}}/{{.APP_NAME}}"
        EXEC_PATH="${EXEC_PATH}" awk '{ if ($0 ~ /^Exec=/) print "Exec=\"" ENVIRON["EXEC_PATH"] "\""; else print }' "build/linux/ca.boostao.tws_traderbot.desktop" > "${APP_DIR}/ca.boostao.tws_traderbot.desktop"
        chmod 644 "${APP_DIR}/ca.boostao.tws_traderbot.desktop"
        if command -v magick >/dev/null 2>&1; then
          magick build/appicon.png -resize 256x256 "${ICON_DIR}/ca.boostao.tws_traderbot.png"
        elif command -v convert >/dev/null 2>&1; then
          convert build/appicon.png -resize 256x256 "${ICON_DIR}/ca.boostao.tws_traderbot.png"
        else
          cp build/appicon.png "${ICON_DIR}/ca.boostao.tws_traderbot.png"
        fi
        if command -v gtk-update-icon-cache >/dev/null 2>&1; then
          gtk-update-icon-cache -f -t "${DATA_DIR}/icons/hicolor" >/dev/null 2>&1 || true
        fi
        if command -v update-desktop-database >/dev/null 2>&1; then
          update-desktop-database "${APP_DIR}" >/dev/null 2>&1 || true
        fi
        if command -v kbuildsycoca6 >/dev/null 2>&1; then
          kbuildsycoca6 --noincremental >/dev/null 2>&1 || true
        fi

  linux:build:
    summary: Builds the production application for Linux
    cmds:
      - task: build:frontend
      - mkdir -p {{.BIN_DIR}}
      - go build -tags production -trimpath -buildvcs=false -o {{.BIN_DIR}}/{{.APP_NAME}} .
      - task: linux:install-desktop
    env:
      CGO_ENABLED: "1"

  build:dev:
    summary: Builds the development Go binary for wails3 dev
    cmds:
      - mkdir -p frontend/dist {{.BIN_DIR}}
      - test -f frontend/dist/index.html || touch frontend/dist/.gitkeep
      - go build -buildvcs=false -o {{.BIN_DIR}}/{{.APP_NAME}} .
    env:
      CGO_ENABLED: "1"

  linux:package:
    summary: Packages Linux binary with SHA-256 checksum
    cmds:
      - task: linux:build
      - tar -czf {{.BIN_DIR}}/{{.APP_NAME}}-linux-amd64.tar.gz -C {{.BIN_DIR}} {{.APP_NAME}}
      - cd {{.BIN_DIR}} && sha256sum {{.APP_NAME}}-linux-amd64.tar.gz > {{.APP_NAME}}-linux-amd64.tar.gz.sha256

  windows:build:
    summary: Builds the production application for Windows
    cmds:
      - task: build:frontend
      - mkdir -p {{.BIN_DIR}}
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui" -o {{.BIN_DIR}}/{{.APP_NAME}}.exe .
    env:
      GOOS: "windows"
      GOARCH: "amd64"
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'

  windows:package:
    summary: Packages Windows binary with SHA-256 checksum
    cmds:
      - task: windows:build
      - zip -j {{.BIN_DIR}}/{{.APP_NAME}}-windows-amd64.zip {{.BIN_DIR}}/{{.APP_NAME}}.exe
      - cd {{.BIN_DIR}} && sha256sum {{.APP_NAME}}-windows-amd64.zip > {{.APP_NAME}}-windows-amd64.zip.sha256

  build:frontend:
    summary: Installs frontend deps and builds the Svelte frontend
    dir: frontend
    cmds:
      - npm install
      - npm run build

  dev:frontend:
    summary: Runs the Vite frontend dev server for wails3 dev
    dir: frontend
    cmds:
      - test -d node_modules || npm install
      - npm run dev -- --host 127.0.0.1 --port {{.VITE_PORT}} --strictPort

  generate:bindings:
    summary: Generates TypeScript bindings for the frontend
    cmds:
      - wails3 generate bindings

  dev:
    summary: Runs the application in development mode
    cmds:
      - task: linux:install-desktop
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  linux:run:
    summary: Runs the built binary
    cmds:
      - ./{{.BIN_DIR}}/{{.APP_NAME}}

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  test:backend:
    summary: Runs Go backend unit tests
    cmds:
      - go test -v -tags=testing ./backend/...

  test:e2e:
    summary: Runs the hermetic E2E test suite (Tiers 1-4)
    cmds:
      - go test -v -count=1 ./tests/e2e/...

  autopilot:run:
    summary: Runs the autopilot CLI
    cmds:
      - go run ./cmd/autopilot

  autopilot:replay:
    summary: Runs the autopilot replay
    cmds:
      - go run ./cmd/autopilot replay

  autopilot:probe:
    summary: Runs the autopilot probe
    cmds:
      - go run ./cmd/autopilot probe
