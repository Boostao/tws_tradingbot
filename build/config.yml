version: '3'

info:
  companyName: "Boostao"
  productName: "TWS Trader Bot"
  productIdentifier: "ca.boostao.tws_traderbot"
  description: "Local TWS/IBKR trading bot with Svelte UI"
  copyright: "(c) 2025, Bruno Tremblay"
  version: "0.1.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - build
      - bin
      - site
      - okf
      - tests
    file:
      - .DS_Store
      - .gitignore
      - "*_test.go"
      - "*.sqlite*"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 task build:frontend
      type: once
    - cmd: wails3 task build:dev
      type: blocking
    - cmd: wails3 task dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
